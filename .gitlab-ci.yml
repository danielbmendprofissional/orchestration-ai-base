# =================================================================
# = IMPORTS
# =================================================================
include:
  - project: personal.daniel.bmend/template-ci
    file:
      - /ci-template.yml
      - /ci-tags.yml
    ref: v1.0.0

# =================================================================
# = VARIÁVEIS GERAIS
# =================================================================

variables:
  APP_TECHNOLOGY: ""

# =================================================================
# = FLUXO
# =================================================================

workflow:
  rules:
    - if: !reference [.tag-conditions, variables, TAG_CANDIDATA]

    - if: '$CI_COMMIT_BRANCH == "qa"'

    - if: '$CI_COMMIT_BRANCH == "homolog"'

    - if: !reference [.tag-conditions, variables, TAG_FINAL]